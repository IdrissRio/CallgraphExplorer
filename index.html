<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callgraph Explorer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cytoscape -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://unpkg.com/layout-base/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base/cose-base.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.min.js"></script>
    
    <!-- Application Styles -->
    <link rel="stylesheet" href="resources/styles.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="background-gradient"></div>
    <div class="background-grid"></div>

    <!-- Header Bar -->
    <header class="header-bar">
        <div class="header-left">
            <button class="icon-btn" id="sidebarToggle" title="Toggle Sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <span>Callgraph Explorer</span>
            </div>
        </div>
        
        <div class="header-center">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" 
                       placeholder="Search nodes... (⌘F)">
            </div>
        </div>
        
        <div class="header-right">
            <button class="icon-btn" id="minimapToggle" title="Toggle Minimap">
                <i class="fas fa-map"></i>
            </button>
            <button class="icon-btn" id="fullscreenToggle" title="Fullscreen">
                <i class="fas fa-expand"></i>
            </button>
            <button class="icon-btn" id="exportBtn" title="Export Graph">
                <i class="fas fa-download"></i>
            </button>
            <button class="icon-btn" id="helpBtn" title="Keyboard Shortcuts">
                <i class="fas fa-keyboard"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <!-- Layout Section -->
        <div class="sidebar-section">
            <div class="section-title">
                <i class="fas fa-th-large"></i>
                Layout
            </div>
            <div class="layout-grid" id="layoutGrid"></div>
        </div>

        <!-- Mode Section -->
        <div class="sidebar-section">
            <div class="section-title">
                <i class="fas fa-mouse-pointer"></i>
                Click Mode
            </div>
            <div class="mode-selector">
                <div class="mode-option active" data-mode="reachability">
                    <i class="fas fa-route"></i> Reachability
                </div>
                <div class="mode-option" data-mode="scc">
                    <i class="fas fa-sync-alt"></i> SCC
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="sidebar-section">
            <div class="section-title">
                <i class="fas fa-filter"></i>
                Node Filters
            </div>
            <div class="filter-list" id="filterList"></div>
        </div>

        <!-- Statistics Section -->
        <div class="sidebar-section">
            <div class="section-title">
                <i class="fas fa-chart-bar"></i>
                Statistics
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="nodeCount">0</div>
                    <div class="stat-label">Nodes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="edgeCount">0</div>
                    <div class="stat-label">Edges</div>
                </div>
            </div>
        </div>

        <!-- Legend Section -->
        <div class="sidebar-section">
            <div class="section-title">
                <i class="fas fa-palette"></i>
                Legend
            </div>
            <div class="legend-list" id="legendList"></div>
        </div>
    </aside>

    <!-- Cytoscape Container -->
    <div id="cy"></div>

    <!-- Floating Controls -->
    <div class="floating-controls">
        <div class="control-group">
            <button class="control-btn" id="zoomIn" title="Zoom In">
                <i class="fas fa-plus"></i>
            </button>
            <button class="control-btn" id="zoomOut" title="Zoom Out">
                <i class="fas fa-minus"></i>
            </button>
            <button class="control-btn" id="zoomFit" title="Fit to Screen">
                <i class="fas fa-expand-arrows-alt"></i>
            </button>
            <button class="control-btn" id="zoomReset" title="Reset View">
                <i class="fas fa-undo"></i>
            </button>
        </div>
    </div>

    <!-- Minimap -->
    <div class="minimap-container" id="minimapContainer">
        <div class="minimap-header">
            <i class="fas fa-map"></i>
            Overview
        </div>
        <div id="minimap"></div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Generating callgraph...</div>
    </div>

    <!-- Keyboard Shortcuts Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fas fa-keyboard"></i>
                    Keyboard Shortcuts
                </div>
                <button class="modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="shortcut-list" id="shortcutList"></div>
        </div>
    </div>

    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- Application JavaScript -->
    <script src="resources/main.js"></script>
</body>

</html>
