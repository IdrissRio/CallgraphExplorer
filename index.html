<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callgraph Visualization</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.18.2/cytoscape.min.js"></script>
    <script src="https://ialab.it.monash.edu/webcola/cola.min.js"></script>
    <script src="https://unpkg.com/cytoscape-cola@2.0.1/cytoscape-cola.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.1.0/chroma.min.js"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Application Styles -->
    <link rel="stylesheet" href="resources/styles.css">
</head>

<body>
    <!-- Menu Button -->
    <div class="menu-button" id="menuButton">
        <i class="fas fa-cog"></i> Settings
    </div>

    <!-- Sidebar Menu -->
    <nav class="hamburger-menu" id="hamburgerMenu">
        <div class="menu-items">
            <!-- Search -->
            <div class="menu-item">
                <input type="text" id="searchInput" placeholder="Search nodes...">
                <button id="searchButton">Search</button>
            </div>

            <!-- Layout Selection -->
            <div class="menu-item">
                <select id="layoutDropdown">
                    <option value="concentric">Concentric Layout</option>
                    <option value="cola">Cola Layout</option>
                    <option value="cose">Cose Layout</option>
                    <option value="breadthfirst">Breadthfirst Layout</option>
                    <option value="circle">Circle Layout</option>
                    <option value="grid">Grid Layout</option>
                </select>
            </div>

            <!-- Mode Toggle -->
            <div class="menu-item">
                <input type="checkbox" id="reachabilityCheckbox" checked>
                <label for="reachabilityCheckbox">Reachability Mode</label>
            </div>

            <!-- Statistics -->
            <div class="statistics">
                <div class="statistics-title">Statistics</div>
                <div class="statistic">
                    <span class="statistic-label">Nodes:</span>
                    <span class="statistic-value" id="nodeCount">0</span>
                </div>
                <div class="statistic">
                    <span class="statistic-label">Edges:</span>
                    <span class="statistic-value" id="edgeCount">0</span>
                </div>
                <div class="statistic">
                    <span class="statistic-label">Synthesized:</span>
                    <span class="statistic-value" id="kindSynNodeCount">0</span>
                </div>
                <div class="statistic">
                    <span class="statistic-label">Inherited:</span>
                    <span class="statistic-value" id="kindInhNodeCount">0</span>
                </div>
                <div class="statistic">
                    <span class="statistic-label">Circular:</span>
                    <span class="statistic-value" id="kindCircularNodeCount">0</span>
                </div>
                <div class="statistic">
                    <span class="statistic-label">Collection:</span>
                    <span class="statistic-value" id="kindCollectionNodeCount">0</span>
                </div>
                <div class="statistic">
                    <span class="statistic-label">Method:</span>
                    <span class="statistic-value" id="kindMethodNodeCount">0</span>
                </div>
            </div>

            <!-- Legend -->
            <div class="legend-container">
                <div class="legend-title">Legend</div>
                <div id="legendItems"></div>
            </div>
        </div>
    </nav>

    <!-- Cytoscape Container -->
    <div id="cy"></div>

    <!-- Application JavaScript -->
    <script src="resources/main.js"></script>
</body>

</html>
